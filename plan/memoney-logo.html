<!doctype html>
<!--
PLAN — MeMoney logo
- Name decided: MeMoney (renamed from Pocket in index.html title + PWA manifest).
- App look decided: iOS Light, accent #007AFF (see plan/pocket-restyle.html option A).
- 4 icon concepts below, all iOS squircle app icons on the blue accent.
  1 Coin M     — white coin with a blue "M"
  2 M + coin   — white "M" whose middle dips into a coin
  3 ± Coin     — coin split into + (income) and − (expense)
  4 Smile coin — friendly coin face ("me")
- After pick: export favicon.svg, pwa-192/512 (+maskable), apple-touch-icon 180; login logo uses same mark.
- OPEN: which concept; tweak colours?
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MeMoney Logo</title>
<style>
  :root { --bg:#f2f2f7; --card:#fff; --ink:#000; --mute:#8e8e93; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme='light']) { --bg:#000; --card:#1c1c1e; --ink:#fff; } }
  :root[data-theme='dark'] { --bg:#000; --card:#1c1c1e; --ink:#fff; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--ink); font:15px/1.3 -apple-system, BlinkMacSystemFont, system-ui, sans-serif; padding:24px 16px 48px; }
  h1 { font-size:22px; margin-bottom:20px; }
  .grid { display:grid; gap:16px; grid-template-columns:repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
  .opt { background:var(--card); border-radius:22px; padding:20px; display:flex; flex-direction:column; align-items:center; gap:16px; }
  .opt h2 { align-self:flex-start; font-size:16px; display:flex; gap:8px; align-items:center; }
  .opt h2 b { width:24px; height:24px; border-radius:50%; background:var(--ink); color:var(--card); display:grid; place-items:center; font-size:12px; }
  .big svg { width:160px; height:160px; filter:drop-shadow(0 8px 18px rgba(0,122,255,.3)); }
  .sizes { display:flex; align-items:flex-end; gap:18px; }
  .home { display:flex; flex-direction:column; align-items:center; gap:4px; font-size:11px; }
  .home svg { width:60px; height:60px; }
  .fav svg { width:20px; height:20px; }
  .word { display:flex; align-items:center; gap:8px; font-size:22px; font-weight:700; letter-spacing:-.5px; }
  .word svg { width:34px; height:34px; }
</style>
</head>
<body>
<h1>MeMoney: logo options</h1>
<div class="grid" id="g"></div>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3395ff"/><stop offset="1" stop-color="#0062d6"/></linearGradient>
  </defs>
</svg>

<script>
const BG = '<rect width="100" height="100" rx="22.5" fill="url(#bg)"/>'
const ICONS = [
  ['Coin M', `${BG}
    <circle cx="50" cy="50" r="30" fill="#fff"/>
    <path d="M37 62V39l13 14 13-14v23" fill="none" stroke="#007aff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>`],
  ['M + coin', `${BG}
    <path d="M27 70V32l23 26 23-26v38" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="50" cy="71" r="9" fill="#ffcc00"/>`],
  ['± Coin', `${BG}
    <circle cx="50" cy="50" r="30" fill="#fff"/>
    <path d="M50 22v56" stroke="#007aff" stroke-width="3" opacity=".25"/>
    <path d="M28 50h14M35 43v14" stroke="#34c759" stroke-width="6" stroke-linecap="round"/>
    <path d="M58 50h14" stroke="#ff3b30" stroke-width="6" stroke-linecap="round"/>`],
  ['Smile coin', `${BG}
    <circle cx="50" cy="50" r="30" fill="#ffcc00"/>
    <circle cx="50" cy="50" r="24" fill="none" stroke="#f0a800" stroke-width="2.5"/>
    <circle cx="41" cy="45" r="3.6" fill="#7a4d00"/><circle cx="59" cy="45" r="3.6" fill="#7a4d00"/>
    <path d="M40 56q10 9 20 0" fill="none" stroke="#7a4d00" stroke-width="4" stroke-linecap="round"/>`],
]
const svg = (b) => `<svg viewBox="0 0 100 100">${b}</svg>`
document.getElementById('g').innerHTML = ICONS.map(([name, body], i) => `
  <section class="opt">
    <h2><b>${i + 1}</b>${name}</h2>
    <div class="big">${svg(body)}</div>
    <div class="sizes">
      <div class="home">${svg(body)}MeMoney</div>
      <div class="fav">${svg(body)}</div>
    </div>
    <div class="word">${svg(body)}MeMoney</div>
  </section>`).join('')
</script>
</body>
</html>
