<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MeMoney · New category modal</title>
<style>
:root{--bg:#f2f2f7;--card:#fff;--ink:#000;--muted:#6c6c70;--sep:#c6c6c8;--fill:rgba(118,118,128,.12);--accent:#007aff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.3 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}button,input{font:inherit}button{border:0;cursor:pointer;color:inherit}button:active{transform:scale(.97)}button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.screen{max-width:480px;margin:auto;padding:32px 16px 130px}h1{font-size:30px;letter-spacing:-.5px;margin:0 0 24px}.seg{display:flex;gap:4px;padding:4px;background:var(--fill);border-radius:999px}.seg button{flex:1;min-height:44px;border-radius:999px;background:transparent;font-weight:600}.seg button[aria-pressed=true]{background:white;box-shadow:0 1px 4px #0002}.seg button:first-child{color:#d70015}.seg button:last-child{color:#248a3d}.label{display:block;color:var(--muted);font-size:13px;font-weight:600;margin:24px 4px 8px}.card{background:white;border-radius:16px;overflow:hidden}.row{display:flex;align-items:center;gap:12px;padding:10px 16px;min-height:64px}.row+.row{border-top:.5px solid var(--sep)}.tile{display:grid;place-items:center;flex:none;width:44px;height:44px;border-radius:14px;background:var(--accent);color:white}.empty{padding:20px 16px;color:var(--muted);font-size:14px}.dock{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);width:min(448px,calc(100% - 32px));display:flex;align-items:center;justify-content:space-between;gap:16px}.tabs{display:flex;gap:6px;padding:8px;border-radius:999px;background:#ffffffb3;backdrop-filter:blur(20px);box-shadow:0 8px 24px #0002}.tabs span{padding:10px 14px;display:grid;place-items:center;color:var(--muted)}.tabs span:last-child{background:var(--fill);color:var(--accent);border-radius:999px}.add{height:60px;width:60px;border-radius:50%;background:var(--accent);color:white;font-size:32px;box-shadow:0 8px 20px #007aff4d}dialog{width:min(468px,calc(100% - 16px));max-height:calc(100dvh - 24px);margin:auto auto max(8px,env(safe-area-inset-bottom));border:0;border-radius:28px;padding:12px 16px 20px;background:var(--bg);color:var(--ink);box-shadow:0 -8px 30px #0002;overflow-y:auto}dialog::backdrop{background:#0006}.grab{touch-action:none;height:5px;width:36px;border-radius:999px;background:#c7c7cc;margin:0 auto 8px}.head{touch-action:none;display:flex;align-items:center;justify-content:space-between;min-height:44px}.head h2{font-size:20px;margin:0;letter-spacing:-.3px}.close{width:44px;height:44px;border-radius:50%;background:var(--fill);display:grid;place-items:center}.context{font-size:13px;color:var(--muted);margin:0 0 20px}.name{display:flex;gap:12px;align-items:center;padding:12px 16px;min-height:76px}.name input{background:none;border:0;min-width:0;width:100%;min-height:44px;font-size:16px}.name input::placeholder{color:var(--muted)}form .label{margin-top:20px}.icons{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:4px}.icons button{height:48px;border-radius:14px;display:grid;place-items:center;background:white;color:var(--muted)}.icons button[aria-pressed=true]{background:var(--accent);color:white}.colors{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.colors button{min-height:44px;display:grid;place-items:center;background:none;border-radius:14px}.swatch{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:white}.swatch svg{width:18px;height:18px}.colors button[aria-pressed=true] .swatch{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--accent)}.actions{display:flex;gap:12px;margin-top:24px}.actions button{min-height:56px;border-radius:999px;font-weight:600}.cancel{background:white;width:104px}.save{flex:1;background:var(--accent);color:white}.save:disabled{background:var(--fill);color:var(--muted);cursor:default}.error{color:#d70015;font-size:13px;margin:16px 4px 0}.notice{font-size:12px;color:var(--muted);margin:24px 4px 0}#status{color:var(--accent);font-size:14px;margin-top:16px}svg.defs{position:absolute;width:0;height:0}@media(prefers-reduced-motion:no-preference){dialog[open]{animation:up .25s cubic-bezier(.2,.9,.3,1)}@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}}
</style>
</head>
<body>
<svg class="defs" aria-hidden="true"><defs>
<symbol id="food" viewBox="0 0 24 24"><path d="M4 3v6c0 3 6 3 6 0V3M7 3v18M20 21V3c-5 0-5 10 0 10"/></symbol>
<symbol id="bag" viewBox="0 0 24 24"><path d="M4 7h16l1 14H3L4 7ZM8 7V5a4 4 0 0 1 8 0v2"/></symbol>
<symbol id="zap" viewBox="0 0 24 24"><path d="m13 2-9 12h7l-1 8 10-13h-7l0-7Z"/></symbol>
<symbol id="car" viewBox="0 0 24 24"><path d="m5 6-2 7v6h18v-6l-2-7H5ZM3 13h18M6 16h1m10 0h1M5 19v2m14-2v2"/></symbol>
<symbol id="coffee" viewBox="0 0 24 24"><path d="M3 8h13v8a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V8ZM16 8h2a3 3 0 0 1 0 6h-2M6 2v3m4-3v3m4-3v3"/></symbol>
<symbol id="house" viewBox="0 0 24 24"><path d="m2 10 10-8 10 8M5 8v13h14V8M9 21v-8h6v8"/></symbol>
<symbol id="briefcase" viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M8 7V3h8v4M2 12c6 4 14 4 20 0M12 12v4"/></symbol>
<symbol id="gift" viewBox="0 0 24 24"><path d="M3 8h18v4H3V8ZM5 12v9h14v-9M12 8v13M12 8C1 8 4-3 12 8Zm0 0c11 0 8-11 0 0Z"/></symbol>
<symbol id="book" viewBox="0 0 24 24"><path d="M12 5C8 2 4 2 2 3v16c4-1 7 0 10 2 3-2 6-3 10-2V3c-2-1-6-1-10 2Zm0 0v16"/></symbol>
<symbol id="heart" viewBox="0 0 24 24"><path d="M12 21 3 12C-4 3 7-2 12 6c5-8 16-3 9 6l-9 9Z"/></symbol>
<symbol id="trend" viewBox="0 0 24 24"><path d="m3 17 6-6 4 4 8-10M15 5h6v6"/></symbol>
<symbol id="dots" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
</defs></svg>
<main class="screen"><h1>Categories</h1><div class="seg" role="group" aria-label="Category type"><button id="expense" aria-pressed="true">Expense</button><button id="income" aria-pressed="false">Income</button></div><span class="label">BUILT IN</span><section class="card" id="builtins"></section><span class="label">YOUR CATEGORIES</span><section class="card" id="custom"></section><p id="status" role="status"></p><p class="notice">Interactive design mockup · Changes stay in this preview.</p></main>
<div class="dock"><div class="tabs" aria-hidden="true"><span>⌂</span><span>▥</span><span>⚙</span></div><button class="add" id="add" aria-label="Add category">+</button></div>
<dialog id="modal" aria-labelledby="title" aria-describedby="context"><div class="grab" aria-hidden="true"></div><header class="head"><h2 id="title">New category</h2><button class="close" id="close" aria-label="Close"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button></header><p class="context" id="context">Expense category</p><form id="form"><label class="label" for="name">NAME</label><div class="card name"><span class="tile" id="preview" aria-hidden="true"></span><input id="name" maxlength="40" placeholder="Category name" autocomplete="off" required autofocus></div><span class="label">ICON</span><div class="icons" id="icons" role="group" aria-label="Icon"></div><span class="label" id="color-label">COLOR · Blue</span><div class="colors" id="colors" role="group" aria-label="Color"></div><p class="error" id="error" role="alert" hidden></p><div class="actions"><button type="button" class="cancel" id="cancel">Cancel</button><button class="save" id="save" disabled>Add category</button></div></form></dialog>
<script>
const $=id=>document.getElementById(id), icon=name=>`<svg aria-hidden="true"><use href="#${name}"/></svg>`;
const palette=[['Green','#248a3d'],['Amber','#b07000'],['Indigo','#5856d6'],['Blue','#007aff'],['Orange','#c93400'],['Pink','#ff2d55'],['Purple','#af52de']];
const builtins={expense:[['Food','food',4],['Shopping','bag',5],['Bills','zap',6],['Transport','car',3],['Other','dots',2]],income:[['Salary','briefcase',0],['Gift','gift',5],['Invest','trend',3]]};
const custom={expense:[],income:[]};let type='expense',selectedIcon='bag',selectedColor=3;
function row(label,glyph,color){const div=document.createElement('div');div.className='row';const tile=document.createElement('span');tile.className='tile';tile.style.background=palette[color][1];tile.innerHTML=icon(glyph);const text=document.createElement('span');text.textContent=label;div.append(tile,text);return div}
function renderList(){for(const t of ['expense','income'])$(t).setAttribute('aria-pressed',String(type===t));$('builtins').replaceChildren(...builtins[type].map(c=>row(...c)));$('custom').replaceChildren(...custom[type].map(c=>row(...c)));if(!custom[type].length){const empty=document.createElement('div');empty.className='empty';empty.textContent=`No custom ${type} categories yet. Tap + to add one.`;$('custom').append(empty)}}
function renderChoices(){ $('preview').innerHTML=icon(selectedIcon);$('preview').style.background=palette[selectedColor][1];$('color-label').textContent='COLOR · '+palette[selectedColor][0];for(const b of $('icons').children)b.setAttribute('aria-pressed',String(b.dataset.icon===selectedIcon));for(const [i,b] of [...$('colors').children].entries()){b.setAttribute('aria-pressed',String(i===selectedColor));b.firstElementChild.innerHTML=i===selectedColor?'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg>':''}}
for(const glyph of ['bag','coffee','car','house','briefcase','food','gift','book','heart','trend']){const b=document.createElement('button');b.type='button';b.dataset.icon=glyph;b.setAttribute('aria-label',glyph);b.innerHTML=icon(glyph);b.onclick=()=>{selectedIcon=glyph;renderChoices()};$('icons').append(b)}
palette.forEach(([name,color],i)=>{const b=document.createElement('button');b.type='button';b.setAttribute('aria-label',name);b.innerHTML=`<span class="swatch" style="background:${color}"></span>`;b.onclick=()=>{selectedColor=i;renderChoices()};$('colors').append(b)});
function open(){selectedIcon=type==='income'?'briefcase':'bag';selectedColor=type==='income'?0:3;$('form').reset();$('save').disabled=true;$('error').hidden=true;$('context').textContent=(type==='expense'?'Expense':'Income')+' category';renderChoices();$('modal').showModal();$('name').focus()}
function close(){$('modal').close();$('add').focus()}
let swipe=null;
for(const handle of [$('modal').querySelector('.head'),$('modal').querySelector('.grab')]){
handle.onpointerdown=e=>{if(!e.isPrimary||e.button!==0||e.target.closest('button'))return;swipe={id:e.pointerId,y:e.clientY};handle.setPointerCapture(e.pointerId)};
handle.onpointermove=e=>{if(swipe?.id===e.pointerId){$('modal').style.transition='none';$('modal').style.transform=`translateY(${Math.max(0,e.clientY-swipe.y)}px)`}};
const reset=()=>{swipe=null;$('modal').style.transition='transform .25s';$('modal').style.transform=''};
handle.onpointerup=e=>{if(swipe?.id!==e.pointerId)return;const distance=e.clientY-swipe.y;reset();if(distance>100)close()};handle.onpointercancel=reset;handle.onlostpointercapture=reset;
}
$('add').onclick=open;$('close').onclick=close;$('cancel').onclick=close;$('modal').addEventListener('cancel',event=>{event.preventDefault();close()});$('modal').onclick=e=>{if(e.target===$('modal')){const r=$('modal').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)close()}};
for(const t of ['expense','income'])$(t).onclick=()=>{type=t;$('status').textContent='';renderList()};
$('name').oninput=()=>{$('save').disabled=!$('name').value.trim();$('error').hidden=true};$('form').onsubmit=e=>{e.preventDefault();const label=$('name').value.trim();if(!label)return;if([...builtins[type],...custom[type]].some(c=>c[0].toLocaleLowerCase()===label.toLocaleLowerCase())){$('error').textContent='This category name already exists.';$('error').hidden=false;return}custom[type].push([label,selectedIcon,selectedColor]);renderList();close();$('status').textContent=`${label} added to ${type} categories.`};renderList();open();
</script>
</body></html>
