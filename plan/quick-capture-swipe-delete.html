<!doctype html>
<!--
MeMoney prototype: Home quick capture, swipe delete, and capture review (2026-09-28)
Scope: visual proposal only. No application, API, or database changes.

Decisions
- Keep the current month, balance, grouped transaction rows, bottom tabs, and Add sheet visual language.
- Tap the Home + button to reveal three 56px choices, top to bottom: Manual, Camera, Voice.
- Manual opens the existing blank Add sheet. Camera opens the device camera/photo chooser; Voice opens a full-screen listening view.
- Voice view: calm white screen, breathing blue orb that grows with your voice level, status, then a short hint under it.
  Words are not shown live (browser speech was dropped for iPhone); what was heard appears on the review sheet.
  Bottom: solid blue check = finish now, light blue × = cancel. All buttons are blue, none black. Auto-stop still ends it.
  After stop, the same view shows Reading (orb spins faster, check locked) until the review sheet opens.
- Camera and Voice parse into one compact review sheet. It shows the guessed amount, category, and note, with date at top left and expense/income at top right. Save stays a deliberate final action.
- The review sheet says where the draft came from and that blue dots mark guesses. Amount stays black like the list.
- Tapping the amount opens an in-sheet keypad (digits, dot, backspace) right under the fields, with one Done button. Tapping category opens the category picker. Guessed values carry a blue cue until edited.
- The review sheet has no keypad or capture buttons by default. Manual entry still uses the existing Add sheet.
- Swipe a transaction left to reveal Delete. Tap Delete to remove it and show Undo; a row tap still opens Edit.
- Never delete merely because a swipe passed a distance threshold. Only one row can stay revealed.
- Existing edit-sheet delete remains available. No new transaction fields or attachment-storage decision.
- On capture error, keep the Add sheet editable and show its existing inline warning.

Open for implementation: decide exact Undo duration; the prototype depicts five seconds.
The HTML mirrors the DOM structure of Home, TxList, Dock, and AddSheet from src/ and links their real stylesheet.
Those components are TSX, so their React render functions cannot run verbatim in a file:// mockup.
-->

  .review-note { min-height: 62px; padding: 10px 14px; border-radius: 16px; background: var(--card); display: flex; align-items: center; gap: 12px; }
  .review-note .value { flex: 1; min-width: 0; display: grid; gap: 2px; }
  .review-note small { color: var(--muted); font-size: 13px; }
  .review-note input { min-width: 0; width: 100%; border: 0; background: transparent; color: var(--ink); font: inherit; font-size: 16px; font-weight: 600; outline: none; }
  .review-note:focus-within { outline: 2px solid var(--accent); }
  .review-save { width: 100%; height: 56px; margin-top: auto; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-size: 17px; font-weight: 600; }
  .review-source { display: flex; align-items: center; gap: 6px; margin: -2px 4px 0; color: var(--muted); font-size: 13px; }
  .review-sheet .review-source .hint-mark { margin: 0; }

  .edit-review { min-height: 500px; }
  .edit-review .review-amount { min-height: 112px; outline: 2px solid var(--accent); }
  .edit-review .review-amount strong { color: var(--ink); }
  .edit-review .review-amount strong::after { content: ''; display: inline-block; width: 3px; height: 38px; margin-left: 3px; vertical-align: -4px; border-radius: 2px; background: var(--accent); animation: caret 1s steps(1) infinite; }
  @keyframes caret { 50% { opacity: 0; } }
  .keypad { margin-top: 4px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .keypad button { height: 54px; border-radius: 14px; background: var(--card); font-size: 24px; display: grid; place-items: center; }
  .keypad button:active { background: var(--fill-hi); }
  .keypad .icon { width: 26px; height: 26px; stroke-width: 1.8; }
  .category-pick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px 4px; margin: 8px 0; }
  .category-pick button { display: grid; justify-items: center; gap: 5px; font-size: 12px; color: var(--muted); }
  .category-pick .cat { width: 52px; height: 52px; border-radius: 16px; }
  .category-pick .cat .icon { width: 24px; height: 24px; }
  .category-pick button[aria-pressed="true"] .cat { box-shadow: 0 0 0 2.5px var(--bg), 0 0 0 5px var(--accent); }
  .category-review { min-height: 360px; }
  .voice-mode { position: absolute; inset: 0; z-index: 30; background: var(--card); display: flex; flex-direction: column; align-items: center; padding: 64px 20px 28px; }
  .voice-title { font-size: 15px; font-weight: 600; color: var(--muted); }
  .voice-center { flex: 1; display: grid; place-content: center; justify-items: center; gap: 22px; }
  .orb { width: 220px; height: 220px; border-radius: 50%; position: relative; overflow: hidden; background: linear-gradient(180deg, #dbe6f5, #eef2f8); animation: breathe 2.6s ease-in-out infinite; }
  .orb::before { content: ''; position: absolute; inset: -35%; background: radial-gradient(42% 26% at 50% 18%, #2f6fd6, transparent 70%), radial-gradient(30% 22% at 78% 38%, #7faaf0, transparent 70%), radial-gradient(34% 30% at 26% 62%, #fff, transparent 70%), radial-gradient(30% 24% at 64% 78%, #c9dcf7, transparent 70%); filter: blur(12px); animation: drift 9s linear infinite; }
  @keyframes breathe { 50% { transform: scale(1.05); } }
  @keyframes drift { to { transform: rotate(360deg); } }
  .voice-mode.reading .orb::before { animation-duration: 2.5s; }
  .voice-mode.reading .voice-status { color: var(--accent); }
  .voice-mode.reading .voice-round:not(.close) { opacity: .35; }
  .voice-status { display: flex; align-items: center; gap: 7px; color: var(--exp); font-size: 15px; font-weight: 600; }
  .voice-center { gap: 18px; }
  .orb { width: 176px; height: 176px; }
  .voice-text { min-height: 96px; max-width: 300px; text-align: center; font-size: 26px; font-weight: 600; line-height: 1.25; letter-spacing: -.3px; }
  .voice-text.hint { color: var(--muted); font-weight: 500; font-size: 22px; }
  .voice-text .tail { color: var(--muted); }
  .voice-bar { display: flex; justify-content: center; gap: 28px; }
  .voice-round { width: 64px; height: 64px; flex: none; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--sep); background: var(--card); box-shadow: 0 6px 20px rgba(0,0,0,.06); }
  .voice-round .icon { width: 24px; height: 24px; }
  .voice-round.close { border: 0; background: color-mix(in srgb, var(--accent) 14%, var(--card)); color: var(--accent); }
  @media (prefers-reduced-motion: reduce) { .orb, .orb::before, .edit-review .review-amount strong::after { animation: none; } }
  .review-variants { display: flex; gap: 8px; margin: -2px 0 10px 5px; }
  .review-variants button { min-height: 36px; padding: 0 14px; border-radius: 999px; background: var(--card); color: var(--muted); font-size: 13px; font-weight: 600; }
  .review-variants button.selected { background: var(--accent); color: var(--accent-ink); }
  .flow { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 16px; border-radius: 16px; background: var(--card); font-size: 13px; }
  .flow span { padding: 10px 12px; background: var(--fill); border-radius: 12px; }
  .flow b { color: var(--muted); }
</style>

<h1 class="proto-title">MeMoney · faster entry</h1>
<div class="frames" id="frames"></div>
<script>
  const icon = (name, cls = '') => `<svg class="icon ${cls}" aria-hidden="true"><use href="#${name}"></use></svg>`
  const txs = [
    {id:'1',type:'expense',amount:'−฿320.00',category:'food',color:'#c93400',merchant:'Noodle House',note:'Lunch with Mai',date:'Today'},
    {id:'2',type:'expense',amount:'−฿89.00',category:'car',color:'#007aff',merchant:'Metro',note:'',date:'Today'},
    {id:'3',type:'expense',amount:'−฿1,240.00',category:'shop',color:'#ff2d55',merchant:'Market',note:'Groceries',date:'Yesterday'},
    {id:'4',type:'expense',amount:'−฿610.00',category:'zap',color:'#af52de',merchant:'Electricity',note:'',date:'Yesterday'},
  ]
  // Static DOM equivalents of Home / TxList / Dock. Data has the same fields as Tx.
  function txRow(t, revealed = false) {
    return `<div class="swipe-slot ${revealed ? 'revealed' : ''}"><button class="swipe-delete" aria-label="Delete ${t.merchant}">${icon('trash')}Delete</button><button class="row tx"><span class="cat" style="background:${t.color}">${icon(t.category)}</span><div class="grow"><div>${t.merchant}</div>${t.note ? `<div class="sub">${t.note}</div>` : ''}</div><span class="num exp">${t.amount}</span></button></div>`
  }
  function dock(expanded = false) {
    return `<nav class="dock"><div class="glass tabs"><a class="active" aria-label="Home">${icon('home')}</a><a aria-label="Stats">${icon('pie')}</a><a aria-label="Settings">${icon('settings')}</a></div><button class="glass fab" aria-label="${expanded ? 'Close add menu' : 'Add'}">${icon('plus')}</button></nav>`
  }
  function home({swipe = false, menu = false, undo = false} = {}) {
    return `<main class="screen"><div class="row between month"><h1>September 2026</h1><div class="row"><button class="icon-btn" aria-label="Previous month">${icon('chevron-left')}</button><button class="icon-btn" aria-label="Next month">${icon('chevron-right')}</button></div></div><section class="summary"><div class="num balance">${undo ? '฿12,901.00' : '฿12,581.00'}</div><div class="io"><span class="num inc">+฿18,000.00</span><span class="num exp">${undo ? '−฿5,099.00' : '−฿5,419.00'}</span></div></section><div class="seg filter" role="group"><button class="n" aria-pressed="true" aria-label="All">${icon('list')}</button><button class="e" aria-label="Expense">${icon('minus')}</button><button class="i" aria-label="Income">${icon('plus')}</button></div><div class="card list"><section><div class="day">Today</div>${undo ? '' : txRow(txs[0],swipe)}${txRow(txs[1])}</section><section><div class="day">Yesterday</div>${txRow(txs[2])}${txRow(txs[3])}</section></div></main>${menu ? `<div class="menu-shade"></div><div class="quick-actions"><div class="action"><span class="action-label">Manual</span><button class="round" aria-label="Manual entry">${icon('pen')}</button></div><div class="action"><span class="action-label">Camera</span><button class="round" aria-label="Scan receipt">${icon('camera')}</button></div><div class="action"><span class="action-label">Voice</span><button class="round" aria-label="Voice entry">${icon('mic')}</button></div></div>` : ''}${undo ? `<div class="undo"><span>Transaction deleted</span><strong>Undo</strong></div>` : ''}${dock(menu)}`
  }
  const categories = [
    {id:'food', label:'Food', icon:'food', color:'#c93400'},
    {id:'transport', label:'Transport', icon:'car', color:'#007aff'},
    {id:'shopping', label:'Shopping', icon:'shop', color:'#ff2d55'},
    {id:'bills', label:'Bills', icon:'zap', color:'#af52de'},
    {id:'home', label:'Home', icon:'home', color:'#0071a4'},
    {id:'health', label:'Health', icon:'health', color:'#ff3b30'},
    {id:'fun', label:'Fun', icon:'fun', color:'#5856d6'},
    {id:'other', label:'Other', icon:'more', color:'#8e8e93'},
  ]
  const selectedCategory = {camera:'shopping', voice:'food'}
  function categoryChoices(kind) {
    return `<div class="category-pick">${categories.map(c => `<button data-category="${c.id}" aria-pressed="${selectedCategory[kind] === c.id}"><span class="cat" style="background:${c.color}">${icon(c.icon)}</span>${c.label}</button>`).join('')}</div>`
  }
  function voiceCapture(state = 'listening') {
    const status = state === 'reading' ? 'Reading what you said…' : `<span class="voice-dot"></span>Listening`
    const text = state === 'start'
      ? `<p class="voice-text hint">Say the amount and what it was for</p>`
      : state === 'listening' ? `<p class="voice-text">Coffee 80 <span class="tail">baht</span></p>` : `<p class="voice-text">Coffee 80 baht</p>`
    return `<div class="voice-mode ${state}" role="dialog" aria-modal="true" aria-label="Voice entry"><div class="voice-title">Voice entry</div><div class="voice-center"><div class="orb" aria-hidden="true"></div><div class="voice-status">${status}</div><div aria-live="polite">${text}</div></div><div class="voice-bar"><button class="voice-round" aria-label="Finish recording"${state === 'reading' ? ' disabled' : ''}>${icon('check')}</button><button class="voice-round close" aria-label="Cancel voice entry">${icon('x')}</button></div></div>`
  }
  function reviewSheet(kind, mode = 'review') {
    const amount = kind === 'voice' ? '฿80.00' : '฿1,240.00'
    const note = kind === 'voice' ? 'Coffee' : 'Groceries'
    const cat = categories.find(c => c.id === selectedCategory[kind])
    const handle = `<div class="handle"><div class="grab"></div></div>`
    const top = `<div class="review-top"><label class="chip hint">${icon('calendar','small')}Today<input type="date" aria-label="Date" value="2026-09-28"></label><div class="seg" role="group"><button class="e" aria-label="Expense" aria-pressed="true">${icon('minus')}</button><button class="i" aria-label="Income" aria-pressed="false">${icon('plus')}</button></div></div>`
    if (mode === 'category') return `<div class="sheet-wrap"><div class="glass sheet review-sheet category-review" role="dialog" aria-modal="true" aria-label="Choose category">${handle}<div class="picker-head">Choose category</div>${categoryChoices(kind)}<button class="review-save" data-review-action="review">Done</button></div></div>`
    const amountCard = mode === 'amount'
      ? `<div class="review-amount"><small>Amount</small><strong>${amount}</strong></div>`
      : `<button class="review-amount" data-review-action="amount"><small>Amount</small><strong>${amount}</strong><span class="edit-cue">Tap to edit</span></button>`
    const categoryRow = `<button class="review-category" data-review-action="category"><span class="cat" style="background:${cat.color}">${icon(cat.icon)}</span><span class="value"><small>Category</small><strong>${cat.label}</strong></span><span class="hint-mark"></span>${icon('chevron-right')}</button>`
    const noteRow = `<label class="review-note"><span class="value"><small>Note</small><input aria-label="Note" value="${note}" maxlength="80"></span><span class="hint-mark"></span></label>`
    if (mode === 'amount') return `<div class="sheet-wrap"><div class="glass sheet review-sheet edit-review" role="dialog" aria-modal="true" aria-label="Edit amount">${handle}${top}${amountCard}${categoryRow}<div class="keypad">${['1','2','3','4','5','6','7','8','9','.','0'].map(k => `<button>${k}</button>`).join('')}<button aria-label="Delete digit">${icon('backspace')}</button></div><button class="review-save" data-review-action="review">Done</button></div></div>`
    const source = `<div class="review-source">${kind === 'voice' ? 'From your voice' : 'From your receipt'} · <span class="hint-mark"></span> = our guess, tap to change</div>`
    return `<div class="sheet-wrap"><div class="glass sheet review-sheet" role="dialog" aria-modal="true" aria-label="Review entry">${handle}${top}${source}${amountCard}${categoryRow}${noteRow}<button class="review-save">Save entry</button></div></div>`
  }
  const frame = (title, content, extra = '') => `<section class="frame"><h2>${title}</h2><div class="phone ${extra}">${content}</div></section>`
  document.querySelector('#frames').innerHTML = [
    frame('1 · Home',home()),
    frame('2 · Swipe left → tap Delete',home({swipe:true})),
    frame('3 · Deleted → Undo',home({undo:true})),
    frame('4 · Tap + → choose entry method',home({menu:true}),'menu-open'),
    `<section class="frame"><h2>5 · Voice capture</h2><div class="review-variants"><button data-voice="start" aria-pressed="false">Start</button><button class="selected" data-voice="listening" aria-pressed="true">Listening</button><button data-voice="reading" aria-pressed="false">Reading</button></div><div class="phone" id="voice-phone">${home()+voiceCapture()}</div></section>`,
    `<section class="frame"><h2>6 · Camera or Voice → review</h2><div class="review-variants"><button class="selected" data-review="camera" aria-pressed="true">Receipt draft</button><button data-review="voice" aria-pressed="false">Voice draft</button></div><div class="phone" id="review-phone">${home()+reviewSheet('camera')}</div></section>`,
    `<div class="flow"><span>Camera or Voice</span><b>→</b><span>Read details</span><b>→</b><span>Review amount + category + note</span><b>→</b><span>Tap to edit if needed</span><b>→</b><span>Save</span></div>`,
  ].join('')
  document.querySelectorAll('[data-voice]').forEach((button) => button.addEventListener('click', () => {
    document.querySelectorAll('[data-voice]').forEach((b) => { b.setAttribute('aria-pressed', String(b === button)); b.classList.toggle('selected', b === button) })
    document.querySelector('#voice-phone').innerHTML = home() + voiceCapture(button.dataset.voice)
  }))
  let reviewKind = 'camera'
  const reviewPhone = document.querySelector('#review-phone')
  const renderReview = (mode = 'review') => { reviewPhone.innerHTML = home() + reviewSheet(reviewKind, mode) }
  document.querySelectorAll('[data-review]').forEach((button) => button.addEventListener('click', () => {
    document.querySelectorAll('[data-review]').forEach((b) => { b.setAttribute('aria-pressed', String(b === button)); b.classList.toggle('selected', b === button) })
    reviewKind = button.dataset.review
    renderReview()
  }))
  reviewPhone.addEventListener('click', (event) => {
    const category = event.target.closest('[data-category]')
    if (category) { selectedCategory[reviewKind] = category.dataset.category; renderReview(); return }
    const action = event.target.closest('[data-review-action]')
    if (action) renderReview(action.dataset.reviewAction)
  })
  reviewPhone.addEventListener('input', (event) => {
    if (event.target.matches('.review-note input')) event.target.closest('.review-note').querySelector('.hint-mark')?.remove()
  })
</script>
</body>
</html>
