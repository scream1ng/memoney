<!doctype html>
<!--
MeMoney usage settings preview, 2026-09-28.
Screens: Settings, Admin, and first sign-in. The first two use the same Usage card from src/screens/Usage.tsx.
Settings shows the app brand, personal usage, Currency, Add passkey, and Sign out.
Admin shows the Admin heading, aggregate usage, and account details.
Usage fields: monthly period, date range, estimated USD, camera and voice calls.
Decisions: center the amount, estimate label, and two call counts; shorten the note.
Default currency is $ when no preference is saved. First sign-in offers optional passkey setup.
Navigation: bottom Home, Stats, Settings, Admin dock with Add button.
Voice entry auto-stops after about 1 second of silence; it has no visual change here.
Sample values only. No API calls, account data, or navigation.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MeMoney · Usage preview</title>
  <link rel="stylesheet" href="../src/styles.css">
  <style>
    html, body { height: auto !important; overflow: auto !important; position: static !important; }
    body { padding: 24px 16px 48px; background: #e5e5ea; }
    .preview { max-width: 840px; margin: auto; }
    .frames { display: flex; flex-wrap: wrap; justify-content: center; gap: 32px; }
    .frame { width: 390px; max-width: 100%; }
    .frame > h2 { margin: 0 0 12px 4px; font-size: 16px; }
    .phone { position: relative; height: 820px; overflow: hidden; border-radius: 42px; background: var(--bg); box-shadow: 0 0 0 8px #1c1c1e; transform: translateZ(0); }
    .phone .screen { height: 100%; min-height: 0; overflow-y: auto; padding-top: 72px; scrollbar-width: none; }
    .phone .screen::-webkit-scrollbar { display: none; }
    .phone .dock { position: absolute; bottom: 14px; }
    .status { position: absolute; z-index: 30; top: 0; left: 0; right: 0; height: 54px; display: flex; align-items: center; justify-content: space-between; padding: 0 28px; font-size: 15px; font-weight: 700; pointer-events: none; }
    .island { position: absolute; top: 10px; left: 50%; width: 118px; height: 34px; border-radius: 22px; background: #000; transform: translateX(-50%); }
    .status-right { display: flex; align-items: center; gap: 6px; }
    .battery { width: 23px; height: 11px; border: 1.5px solid #111; border-radius: 3px; padding: 1.5px; }
    .battery::before { content: ''; display: block; width: 75%; height: 100%; border-radius: 1px; background: #111; }
    .icon { display: block; width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .icon.small { width: 18px; height: 18px; }
    .icon.tab { width: 22px; height: 22px; }
    .icon.add { width: 28px; height: 28px; }
    .ico .icon { width: 18px; height: 18px; }
    .proto-backdrop { position: absolute; z-index: 40; inset: 0; background: rgba(0, 0, 0, .32); }
    .phone .passkey-prompt { position: absolute; z-index: 41; top: 50%; left: 50%; transform: translate(-50%, -50%); }
    .phone .passkey-prompt > .icon { width: 32px; height: 32px; margin: 0 auto; }
  </style>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none">
    <symbol id="refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.5-4.5L3 9m0-5v5h5M4 13a8 8 0 0 0 14.5 4.5L21 15m0 5v-5h-5"/></symbol>
    <symbol id="left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
    <symbol id="right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
    <symbol id="home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></symbol>
    <symbol id="chart" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-9-9v9Z M12 3a9 9 0 0 1 9 9h-9Z"/></symbol>
    <symbol id="settings" viewBox="0 0 24 24"><path d="M10 2h4l.6 2.1 1.6.7 2-.9 2.8 2.8-.9 2 .7 1.6L23 11v4l-2.2.6-.7 1.6.9 2-2.8 2.8-2-.9-1.6.7L14 24h-4l-.6-2.2-1.6-.7-2 .9L3 19.2l.9-2-.7-1.6L1 15v-4l2.2-.6.7-1.6-.9-2L5.8 4l2 .9 1.6-.7Z" transform="translate(0 -1) scale(1 .92)"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="shield" viewBox="0 0 24 24"><path d="M12 2 20 5v6c0 5-3 8-8 11-5-3-8-6-8-11V5Z"/></symbol>
    <symbol id="plus" viewBox="0 0 24 24"><path d="M12 3v18M3 12h18"/></symbol>
    <symbol id="coins" viewBox="0 0 24 24"><circle cx="10" cy="14" r="6"/><path d="M14 3a6 6 0 0 1 6 6v2M10 11v6m-2-4h4"/></symbol>
    <symbol id="fingerprint" viewBox="0 0 24 24"><path d="M3 11a9 9 0 0 1 18 0M5 16v-5a7 7 0 0 1 14 0v3M8 19v-8a4 4 0 0 1 8 0v6M12 22v-11M16 20c2-2 3-4 3-6"/></symbol>
    <symbol id="logout" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></symbol>
    <symbol id="wifi" viewBox="0 0 24 24"><path d="M2 9a15 15 0 0 1 20 0M5 12a10 10 0 0 1 14 0M8 15a5 5 0 0 1 8 0M12 19h.01"/></symbol>
    <symbol id="wallet" viewBox="0 0 24 24"><path d="M3 6h16a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V7a3 3 0 0 1 3-3h12M16 12h5v5h-5a2 2 0 0 1-2-2v-1a2 2 0 0 1 2-2Z"/></symbol>
  </svg>
  <div class="preview"><div class="frames" id="frames"></div></div>
  <script>
    const icon = (name, size = '') => `<svg class="icon ${size}" aria-hidden="true"><use href="#${name}"></use></svg>`
    // Markup mirrors src/screens/Usage.tsx with sample values.
    function usage(admin) {
      const usd = admin ? '$0.0042' : '$0.0007'
      const camera = admin ? 3 : 0
      const voice = admin ? 24 : 10
      return `<section class="card usage" aria-label="${admin ? 'All accounts API usage' : 'Your API usage'}">
        <div class="row between"><h2>${admin ? 'All accounts' : 'API usage'}</h2><button class="icon-btn" aria-label="Refresh usage">${icon('refresh', 'small')}</button></div>
        <div class="seg usage-period" role="group" aria-label="Usage period"><button aria-pressed="false">Weekly</button><button aria-pressed="true">Monthly</button></div>
        <div class="row between usage-range"><button class="icon-btn" aria-label="Previous period">${icon('left', 'small')}</button><span>1 Sep 2026 – 30 Sep 2026</span><button class="icon-btn" aria-label="Next period" disabled>${icon('right', 'small')}</button></div>
        <div class="usage-result"><div class="usage-amount num">${usd}</div><p class="sub">Estimated USD</p>
          <div class="usage-counts"><span><strong>${camera}</strong> Camera calls</span><span><strong>${voice}</strong> Voice calls</span></div>
          ${admin ? `<div class="usage-accounts"><h3>Accounts <span class="sub">(2)</span></h3>
            <details><summary><span class="usage-person"><strong>Alex</strong><span class="sub">alex@example.com</span></span><span class="num">$0.0028</span>${icon('right', 'small')}</summary><p class="sub">2 camera calls · 16 voice calls</p></details>
            <details><summary><span class="usage-person"><strong>Sam</strong><span class="sub">sam@example.com</span></span><span class="num">$0.0014</span>${icon('right', 'small')}</summary><p class="sub">1 camera call · 8 voice calls</p></details>
          </div>` : ''}
        </div><p class="sub usage-note">New activity only. Voice may use two calls; costs are estimates.</p>
      </section>`
    }
    // Markup mirrors src/components/ui.tsx Dock, with static preview links.
    function dock(active) {
      return `<nav class="dock"><div class="glass tabs">${[['home', 'Home'], ['chart', 'Stats'], ['settings', 'Settings'], ['shield', 'Admin']].map(([name, label]) => `<a class="${label === active ? 'active' : ''}" aria-label="${label}">${icon(name, 'tab')}</a>`).join('')}</div><button class="glass fab" aria-label="Add">${icon('plus', 'add')}</button></nav>`
    }
    function frame(title, content) {
      return `<section class="frame"><h2>${title}</h2><div class="phone">
        <div class="status"><span>9:41</span><span class="island"></span><span class="status-right">${icon('wifi', 'small')}<span class="battery"></span></span></div>
        ${content}</div></section>`
    }
    const settings = `<main class="screen"><div class="brand"><img src="../public/favicon.svg" alt="">MeMoney</div>${usage(false)}
      <section class="card set"><button class="row between"><span class="row"><span class="ico" style="background:#ff9500">${icon('coins')}</span>Currency</span><span class="val">$ ${icon('right', 'small')}</span></button></section>
      <section class="card set"><button class="row between"><span class="row"><span class="ico" style="background:var(--accent)">${icon('fingerprint')}</span>Add passkey</span><span class="val">${icon('right', 'small')}</span></button></section>
      <section class="card set"><button class="row danger"><span class="ico" style="background:var(--exp)">${icon('logout')}</span>Sign out</button></section></main>${dock('Settings')}`
    const admin = `<main class="screen"><h1>Admin</h1>${usage(true)}</main>${dock('Admin')}`
    const firstSignIn = `<main class="screen"><div class="row between month"><h1>September 2026</h1></div>
      <section class="summary"><div class="num balance">$0</div><div class="io"><span class="num inc">+$0</span><span class="num exp">−$0</span></div></section>
      <div class="empty"><div class="big">${icon('wallet')}</div></div></main>${dock('Home')}
      <div class="proto-backdrop"></div><dialog open class="passkey-prompt" aria-labelledby="passkey-title" aria-describedby="passkey-description">
        ${icon('fingerprint')}<h2 id="passkey-title">Set up a passkey?</h2>
        <p id="passkey-description">Sign in next time with Face ID, Touch ID, or your device passcode.</p>
        <button class="primary">Set up passkey</button><button>Maybe later</button></dialog>`
    document.getElementById('frames').innerHTML = frame('Settings', settings) + frame('Admin', admin) + frame('First sign-in', firstSignIn)
  </script>
</body>
</html>
